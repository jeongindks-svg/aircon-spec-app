<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>싱글 에어컨 규격 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#17212B; --muted:#5C6B7A; --line:#D3DAE1;
  --cool:#1062B0; --heat:#B4532A; --focus:#1062B0;
  --font:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#18222C; --sunk:#131C24; --ink:#E6ECF2; --muted:#93A2B1; --line:#2A3743;
    --cool:#5AA6F0; --heat:#E08A5E; --focus:#5AA6F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#18222C; --sunk:#131C24; --ink:#E6ECF2; --muted:#93A2B1; --line:#2A3743;
  --cool:#5AA6F0; --heat:#E08A5E; --focus:#5AA6F0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em}
.title-row small{color:var(--muted);font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:0 6px 0 12px;height:48px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:17px;height:100%}
.search input::placeholder{color:var(--muted)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.icon-btn:active{background:var(--sunk)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.filter-btn{display:inline-flex;align-items:center;gap:6px}
.chip .count{min-width:18px;height:18px;border-radius:9px;background:var(--cool);color:#fff;font-size:11px;
  display:inline-grid;place-items:center;padding:0 5px}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0 0;font-size:13px;color:var(--muted)}
.meta-row button{color:var(--cool);font-weight:500;font-size:13px}

/* ---------- list ---------- */
main{padding:10px 12px 40px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.card:active{background:var(--sunk)}
.plate{width:64px;border:2px solid var(--ink);border-radius:6px;text-align:center;padding:5px 0 4px;line-height:1}
.plate b{display:block;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.plate i{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.card .body{min-width:0}
.model{font-size:16px;font-weight:600;letter-spacing:0.01em;word-break:break-all}
.sub{font-size:13px;color:var(--muted);margin-top:1px;word-break:break-all}
mark{background:color-mix(in srgb, var(--cool) 22%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);color:var(--ink)}
.tag.co{border-color:var(--cool);color:var(--cool)}
.tag.p3{border-color:var(--heat);color:var(--heat)}
.nums{font-size:12.5px;margin-top:6px;color:var(--muted)}
.nums .c{color:var(--cool);font-weight:600}
.nums .h{color:var(--heat);font-weight:600}
.star{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--line)}
.star[aria-pressed="true"]{color:#E0A100}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:16px;height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:12px 16px 24px;line-height:1.6}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;
  max-height:85%;overflow:auto;transform:translateY(100%);transition:transform .25s ease;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:16px;margin:0 0 4px}
.sheet h3{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 8px}
.sheet .opts{display:flex;flex-wrap:wrap;gap:6px}
.sheet .actions{display:flex;gap:8px;margin-top:20px}
.sheet .actions button{flex:1;height:46px;border-radius:12px;font-weight:600;border:1px solid var(--line)}
.sheet .actions .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transform:translateX(100%);
  transition:transform .25s ease;visibility:hidden}
.detail.on{transform:none;visibility:visible}
.d-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 0}
.d-bar{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto}
.d-bar .t{flex:1;min-width:0;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 8px 10px;max-width:720px;margin:0 auto}
.d-nav::-webkit-scrollbar{display:none}
.d-nav a{flex:none;font-size:13px;color:var(--ink);text-decoration:none;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.d-body{max-width:720px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:14px}
.hero .models{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.hero .models span{color:var(--muted)}
.hero .models b{font-weight:600;word-break:break-all}
.hero .big{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.hero .big div{line-height:1.15}
.hero .big small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.hero .big b{font-size:30px;font-weight:700;letter-spacing:-0.02em}
.hero .big b em{font-style:normal;font-size:14px;font-weight:500;margin-left:3px;color:var(--muted)}
.hero .big .c b{color:var(--cool)} .hero .big .h b{color:var(--heat)}
.hero .tags{margin-top:12px}
.copy{display:inline-flex;gap:6px;align-items:center;margin-top:12px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;background:var(--sunk)}
section.sec{margin-top:18px}
section.sec h2{font-size:14px;font-weight:700;margin:0 4px 8px}
dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
dl .r{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
dl .r:first-child,dl .r.cont{border-top:0}
dl .r.cont{padding-top:0}
dt{color:var(--muted);font-size:13.5px}
dd{margin:0;font-size:14.5px;font-weight:500;word-break:break-word}
dd .u{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:2px}
dd .mm{color:var(--muted);font-weight:400}
.src{font-size:12px;color:var(--muted);margin:18px 4px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ .sheet,.detail,.scrim,.toast{transition:none} }
@media (min-width:720px){ main{padding:16px 0 40px} }
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>싱글 에어컨 규격 검색</h1>
      <small>2023 국판 SINGLE · R410A</small>
    </div>

      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" spellcheck="false"
        placeholder="모델명, 능력(11kW), 판넬·압축기 모델" aria-label="검색어">
      <button class="icon-btn" id="clear" aria-label="검색어 지우기" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <div class="chips" id="cats" role="group" aria-label="제품군"></div>
    <div class="meta-row"><span id="count"></span><button id="reset" hidden>필터 초기화</button></div>
  </div>
</header>

<main class="wrap"><div id="list"></div>
  <p class="foot">삼성 시스템 에어컨 싱글 Technical Data Book(2023, 60Hz)의 제품 규격 페이지 기준입니다.<br>원본에 값이 없는 항목은 표시하지 않았어요.</p>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="fsheet" role="dialog" aria-modal="true" aria-labelledby="fsheet-t">

  <h3>정렬</h3><div class="opts" id="f-sort"></div>
  <div class="actions"><button id="f-clear">초기화</button><button class="primary" id="f-done">결과 보기</button></div>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="d-head">
    <div class="d-bar">
      <button class="icon-btn" id="d-back" aria-label="목록으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="t" id="d-title"></div>
      <button class="star" id="d-star" aria-label="즐겨찾기" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9L3.4 9.5l6-.8z"/></svg>
      </button>
    </div>
    <nav class="d-nav" id="d-nav" aria-label="항목 바로가기"></nav>
  </div>
  <div class="d-body" id="d-body"></div>
</div>
<div class="toast" id="toast" role="status"></div>

const CATS = [
  ['all','전체'],['windfree_1way_cassette','무풍 1Way'],['windfree_4way_cassette','무풍 4Way'],
  ['360_cassette','360 카세트'],['duct','덕트'],['ceiling','실링'],['pac','PAC(스탠드)']];
const CAT_LABEL = Object.fromEntries(CATS);
const GRADES = ['플레그십','프리미엄','디럭스','스탠다드'];
const ALIAS = {
  '1WAY':['cat','windfree_1way_cassette'],'원웨이':['cat','windfree_1way_cassette'],'1웨이':['cat','windfree_1way_cassette'],

  '360':['cat','360_cassette'],'카세트':['catsub','cassette'],'CASSETTE':['catsub','cassette'],
  '덕트':['cat','duct'],'DUCT':['cat','duct'],'실링':['cat','ceiling'],'천장':['cat','ceiling'],'CEILING':['cat','ceiling'],
  'PAC':['cat','pac'],'스탠드':['cat','pac'],'스탠드형':['cat','pac'],
  '무풍':['catsub','windfree'],'WINDFREE':['catsub','windfree'],
  '냉방전용':['mode','cooling_only'],'냉전':['mode','cooling_only'],'냉난방':['mode','heat_pump'],'히트펌프':['mode','heat_pump'],
  '플레그십':['grade','플레그십'],'플래그십':['grade','플레그십'],'프리미엄':['grade','프리미엄'],'디럭스':['grade','디럭스'],'스탠다드':['grade','스탠다드'],'스텐다드':['grade','스탠다드'],
  '단상':['pw',1],'삼상':['pw',3],'3상':['pw',3],'380V':['pw',3],'220V':['pw',1]
};

/* ---------- prep ---------- */
const norm = s => String(s||'').toUpperCase().replace(/[\s\-_/]/g,'');
DATA.forEach((r,i)=>{
  r._id = r.indoor_model + '__' + r.outdoor_model;
  r._hay = norm([r.indoor_model,r.outdoor_model,r.panel_model,r.compressor_model,r.remote_wireless,r.remote_wired,
                 r.category,CAT_LABEL[r.category_en],r.grade].join('|'));
});
const CAPS = [...new Set(DATA.map(r=>r.nominal_capacity_kw))].sort((a,b)=>a-b);

/* ---------- state ---------- */
const S = { q:'', cat:'all', mode:null, grades:new Set(), caps:new Set(), pw:null, sort:'cap', favOnly:false };
let FAV = new Set();
try{ FAV = new Set(JSON.parse(localStorage.getItem('single-fav')||'[]')); }catch(e){}
const saveFav = ()=>{ try{ localStorage.setItem('single-fav', JSON.stringify([...FAV])); }catch(e){} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => v==null ? '' : (typeof v==='number' ? v.toLocaleString('ko-KR',{maximumFractionDigits:3}) : v);
const fmtKw = v => v==null ? '-' : Number(v).toFixed(1);

/* ---------- search ---------- */
function tokenMatch(r, tok){
  const a = ALIAS[tok];
  if(a){
    if(a[0]==='cat') return r.category_en===a[1];
    if(a[0]==='catsub') return r.category_en.includes(a[1]);
    if(a[0]==='mode') return r.mode===a[1];
    if(a[0]==='grade') return r.grade===a[1];
    if(a[0]==='pw') return r.odu_power_phase===a[1];
  }
  const m = tok.match(/^(\d+(?:\.\d+)?)(KW)?$/);
  if(m){
    const n = parseFloat(m[1]);
    if(Math.abs(r.nominal_capacity_kw - n) < 0.001) return true;
    if(m[2]) return false;
  }
  return r._hay.includes(tok);
}
function filtered(){
  const toks = S.q.trim().split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  let out = DATA.filter(r=>{
    if(S.favOnly && !FAV.has(r._id)) return false;
    if(S.cat!=='all' && r.category_en!==S.cat) return false;
    if(S.mode && r.mode!==S.mode) return false;
    if(S.grades.size && !S.grades.has(r.grade)) return false;
    if(S.caps.size && !S.caps.has(r.nominal_capacity_kw)) return false;
    if(S.pw && r.odu_power_phase!==S.pw) return false;
    return toks.every(t=>tokenMatch(r,t));
  });
  const catOrder = Object.fromEntries(CATS.map((c,i)=>[c[0],i]));
  if(S.sort==='cap') out.sort((a,b)=>a.nominal_capacity_kw-b.nominal_capacity_kw || catOrder[a.category_en]-catOrder[b.category_en] || a.indoor_model.localeCompare(b.indoor_model));
  else if(S.sort==='cat') out.sort((a,b)=>catOrder[a.category_en]-catOrder[b.category_en] || a.nominal_capacity_kw-b.nominal_capacity_kw);
  else if(S.sort==='eff') out.sort((a,b)=>(b.cspf||0)-(a.cspf||0));
  return out;
}
function hl(text){
  const toks = S.q.trim().split(/\s+/).map(norm).filter(t=>t.length>=2 && !ALIAS[t]);
  let s = esc(text);
  toks.forEach(t=>{
    const i = norm(text).indexOf(t);
    if(i>=0 && !/[\s\-]/.test(text)){ s = esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+t.length))+'</mark>'+esc(text.slice(i+t.length)); }
  });
  return s;
}

/* ---------- render list ---------- */
const STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9L3.4 9.5l6-.8z"/></svg>';
function card(r){
  const co = r.mode==='cooling_only';
  const p3 = r.odu_power_phase===3;
  return `<div class="card" role="button" tabindex="0" data-id="${esc(r._id)}">
    <div class="plate"><b>${fmtKw(r.nominal_capacity_kw)}</b><i>kW</i></div>
    <div class="body">
      <div class="model">${hl(r.indoor_model)}</div>
      <div class="sub">실외기 ${hl(r.outdoor_model)}</div>
      <div class="tags">
        <span class="tag">${esc(CAT_LABEL[r.category_en])}</span>
        <span class="tag">${esc(r.grade)}</span>
        <span class="tag ${co?'co':''}">${co?'냉방전용':'냉난방'}</span>
        <span class="tag ${p3?'p3':''}">${p3?'3Φ 380V':'1Φ 220V'}</span>
      </div>
      <div class="nums">냉방 <span class="c">${fmtKw(r.cooling_capacity_kw_rated)}</span>${co?'':` · 난방 <span class="h">${fmtKw(r.heating_capacity_kw_rated)}</span>`} kW${r.cspf?` · CSPF ${r.cspf}`:''}</div>
    </div>
    <button class="star" data-star="${esc(r._id)}" aria-label="즐겨찾기" aria-pressed="${FAV.has(r._id)}">${STAR}</button>
  </div>`;
}
function activeFilterCount(){
  return (S.mode?1:0)+S.grades.size+S.caps.size+(S.pw?1:0);
}
function render(){
  const rows = filtered();
  $('#count').textContent = `${rows.length}개 모델`;
  const any = S.q || S.cat!=='all' || activeFilterCount() || S.favOnly;
  $('#reset').hidden = !any;
  $('#clear').hidden = !S.q;
  if(!rows.length){
    $('#list').innerHTML = `<div class="empty"><strong>${S.favOnly && !FAV.size ? '즐겨찾기한 모델이 없어요' : '조건에 맞는 모델이 없어요'}</strong>
      ${S.favOnly && !FAV.size ? '모델 옆의 별을 눌러 자주 보는 모델을 모아 두세요.' : '모델명 일부(예: 110, CN4)나 능력(예: 11kW)으로 검색해 보세요.'}
      <br><button id="empty-reset">필터 초기화</button></div>`;
    $('#empty-reset').onclick = resetAll;
  } else {
    $('#list').innerHTML = rows.map(card).join('');
  }
  renderCats();
}
function renderCats(){
  const n = activeFilterCount();
  $('#cats').innerHTML =
    `<button class="chip filter-btn" id="open-f" aria-haspopup="dialog">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>필터${n?`<span class="count">${n}</span>`:''}</button>` +
    `<button class="chip" data-fav aria-pressed="${S.favOnly}">★ 즐겨찾기</button>` +
    CATS.map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}">${l}</button>`).join('');
}
function resetAll(){
  S.q=''; $('#q').value=''; S.cat='all'; S.mode=null; S.grades.clear(); S.caps.clear(); S.pw=null; S.favOnly=false;
  render(); renderFilter();
}

/* ---------- filter sheet ---------- */
function opt(group,val,label,on){ return `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}</button>`; }
function renderFilter(){
  $('#f-mode').innerHTML = opt('mode','','전체',!S.mode)+opt('mode','heat_pump','냉난방',S.mode==='heat_pump')+opt('mode','cooling_only','냉방전용',S.mode==='cooling_only');
  $('#f-grade').innerHTML = GRADES.map(g=>opt('grade',g,g,S.grades.has(g))).join('');
  $('#f-cap').innerHTML = CAPS.map(c=>opt('cap',c,c.toFixed(1),S.caps.has(c))).join('');
  $('#f-pw').innerHTML = opt('pw','','전체',!S.pw)+opt('pw','1','단상 220V',S.pw===1)+opt('pw','3','삼상 380V',S.pw===3);
  $('#f-sort').innerHTML = opt('sort','cap','능력 순',S.sort==='cap')+opt('sort','cat','제품군 순',S.sort==='cat')+opt('sort','eff','효율(CSPF) 높은 순',S.sort==='eff');
}
function openSheet(){ renderFilter(); $('#scrim').classList.add('on'); $('#fsheet').classList.add('on'); }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#fsheet').classList.remove('on'); }
$('#fsheet').addEventListener('click',e=>{
  const b = e.target.closest('[data-g]'); if(!b) return;
  const g=b.dataset.g, v=b.dataset.v;
  if(g==='mode') S.mode = v||null;
  if(g==='grade') S.grades.has(v)?S.grades.delete(v):S.grades.add(v);
  if(g==='cap'){ const n=parseFloat(v); S.caps.has(n)?S.caps.delete(n):S.caps.add(n); }
  if(g==='pw') S.pw = v?parseInt(v):null;
  if(g==='sort') S.sort = v;
  renderFilter(); render();
});
$('#f-done').onclick = closeSheet;
$('#f-clear').onclick = ()=>{ S.mode=null; S.grades.clear(); S.caps.clear(); S.pw=null; S.sort='cap'; renderFilter(); render(); };
$('#scrim').onclick = closeSheet;

/* ---------- detail ---------- */
const MMM = ['min','rated','max'], HML = ['high','mid','low'];
const phaseTxt = (u,r)=> r[u+'_power_phase']==null ? null : `${r[u+'_power_phase']}Φ ${r[u+'_power_wires']}선 ${r[u+'_power_voltage_v']}V ${r[u+'_power_freq_hz']}Hz`;
const tri = (r,k,unit,names=MMM)=>{
  const v = names.map(n=>r[`${k}_${n}`]);
  if(v.every(x=>x==null)) return null;
  return v.map((x,i)=> i===1 && names===MMM ? `<b>${x==null?'-':fmt(x)}</b>` : (x==null?'-':fmt(x))).join(' / ') + ` <span class="u">${unit}</span>`;
};
const dim = (r,k)=>{
  const v=['w','h','d'].map(n=>r[`${k}_${n}_mm`]);
  if(v.every(x=>x==null)) return null;
  return v.map(x=>x==null?'-':fmt(x)).join(' × ') + ' <span class="u">mm</span>';
};
const val = (r,k,unit)=> r[k]==null ? null : esc(fmt(r[k])) + (unit?` <span class="u">${unit}</span>`:'');
const pipe = (r,k)=>{
  if(r[`pipe_${k}_mm`]==null) return null;
  return `Φ${fmt(r[`pipe_${k}_mm`])} <span class="u">mm</span>${r[`pipe_${k}_inch`]?` <span class="mm">(${esc(r[`pipe_${k}_inch`])}″)</span>`:''}${r[`pipe_${k}_type`]?` <span class="mm">${esc(r[`pipe_${k}_type`])}</span>`:''}`;
};
const trng = (r,m)=> r[`op_temp_${m}_min_c`]==null ? null : `${r[`op_temp_${m}_min_c`]} ~ ${r[`op_temp_${m}_max_c`]} <span class="u">℃</span>`;
const motor = (r,u)=> r[`${u}_fan_motor_w`]==null ? null : `${fmt(r[`${u}_fan_motor_w`])} <span class="u">W</span> × ${fmt(r[`${u}_fan_motor_qty`])}`;

const SECTIONS = [
  ['perf','성능',[
    ['냉방능력 (최소/정격/최대)', r=>tri(r,'cooling_capacity_kw','kW')],
    ['', r=>tri(r,'cooling_capacity_kcalh','kcal/h')],
    ['냉방 현열(SH)', r=>val(r,'sensible_cooling_kw','kW')],
    ['난방능력 (최소/정격/최대)', r=>tri(r,'heating_capacity_kw','kW')],
    ['', r=>tri(r,'heating_capacity_kcalh','kcal/h')],
  ]],
  ['elec','전력·효율',[
    ['소비전력 냉방', r=>tri(r,'power_cooling_kw','kW')],
    ['소비전력 난방', r=>tri(r,'power_heating_kw','kW')],
    ['운전전류 냉방', r=>tri(r,'current_cooling_a','A')],
    ['운전전류 난방', r=>tri(r,'current_heating_a','A')],
    ['운전전류 (최대)', r=>val(r,'current_max_a','A')],
    ['차단기 (MCCB+ELB)/(ELCB)', r=>val(r,'breaker_a','A')],
    ['CSPF (냉방)', r=>r.cspf==null?null:`${fmt(r.cspf)} <span class="u">W/W</span>${r.cspf_grade!=null?` <span class="mm">${r.cspf_grade}등급</span>`:''}`],
    ['HSPF (난방)', r=>r.hspf==null?null:`${fmt(r.hspf)} <span class="u">W/W</span>${r.hspf_grade!=null?` <span class="mm">${r.hspf_grade}등급</span>`:''}`],
  ]],
  ['pipe','배관',[
    ['액관', r=>pipe(r,'liquid')],
    ['가스관', r=>pipe(r,'gas')],
    ['단열재', r=>val(r,'pipe_insulation')],
    ['허용 배관길이 (표준)', r=>val(r,'pipe_length_std_m','m')],
    ['허용 배관길이 (최대)', r=>val(r,'pipe_length_max_m','m')],
    ['허용 고저차 (최대)', r=>val(r,'height_diff_max_m','m')],
  ]],
  ['wire','배선',[
    ['접지선 굵기', r=>val(r,'wire_ground_mm2','mm²')],
    ['실내/외기 전원연결선 1(L),2(N)', r=>val(r,'wire_interconnect_power_mm2','mm²')],
    ['실내/외기 통신연결선 F1,F2', r=>val(r,'wire_interconnect_comm_mm2','mm²')],
    ['전원배선 종류', r=>val(r,'power_cable_type')],
    ['전원배선 규격 (50m 미만)', r=>val(r,'power_cable_under50m_mm2','mm²')],
  ]],
  ['ref','냉매',[
    ['종류', r=>val(r,'refrigerant')],
    ['충진량', r=>val(r,'refrigerant_charge_kg','kg')],
    ['냉매 조작방법', r=>val(r,'refrigerant_control')],
  ]],
  ['idu','실내기',[
    ['모델명', r=>val(r,'indoor_model')],
    ['전원사양', r=>phaseTxt('idu',r)],
    ['제품 치수 (W×H×D)', r=>dim(r,'idu_size')],
    ['제품 중량', r=>val(r,'idu_weight_kg','kg')],
    ['포장 치수 (W×H×D)', r=>dim(r,'idu_pack')],
    ['포장 중량', r=>val(r,'idu_packed_weight_kg','kg')],
    ['풍량 (최대/중간/최소)', r=>tri(r,'idu_airflow_cmm','m³/min',HML)],
    ['', r=>tri(r,'idu_airflow_ls','l/s',HML)],
    ['기외정압 (최대/중간/최소)', r=>tri(r,'idu_esp_mmaq','mmAq',HML)],
    ['', r=>tri(r,'idu_esp_pa','Pa',HML)],
    ['송풍기', r=>r.idu_fan_type==null?null:`${esc(r.idu_fan_type)} × ${fmt(r.idu_fan_qty)}`],
    ['팬모터', r=>r.idu_fan_motor_type==null?null:`${esc(r.idu_fan_motor_type)} <span class="mm">${motor(r,'idu')||''}</span>`],
    ['열교환기', r=>r.idu_hex_type==null?null:`${esc(r.idu_hex_type)} <span class="mm">핀 ${esc(r.idu_hex_fin||'-')} / 튜브 ${esc(r.idu_hex_tube||'-')}</span>`],
    ['핀 표면처리', r=>val(r,'idu_hex_fin_coating')],
    ['드레인 배관', r=>val(r,'idu_drain_pipe')],
    ['드레인 펌프', r=>r.drain_pump==null?null:`${esc(r.drain_pump)}${r.drain_pump_head_mm!=null?` <span class="mm">양정 ${fmt(r.drain_pump_head_mm)}mm / ${fmt(r.drain_pump_flow_lh)} l/h</span>`:''}`],
    ['무선 리모컨', r=>val(r,'remote_wireless')],
    ['유선 리모컨', r=>val(r,'remote_wired')],
    ['케이스 재질', r=>val(r,'idu_case_material')],
  ]],
  ['panel','판넬',[
    ['모델명', r=>val(r,'panel_model')],
    ['형식', r=>val(r,'panel_type')],
    ['재질·색상', r=>r.panel_material==null?null:`${esc(r.panel_material)} <span class="mm">${esc(r.panel_color||'')}</span>`],
    ['제품 치수 (W×H×D)', r=>dim(r,'panel_size')],
    ['제품 중량', r=>val(r,'panel_weight_kg','kg')],
    ['포장 치수 (W×H×D)', r=>dim(r,'panel_pack')],
    ['포장 중량', r=>val(r,'panel_packed_weight_kg','kg')],
  ]],
  ['odu','실외기',[
    ['모델명', r=>val(r,'outdoor_model')],
    ['전원사양', r=>phaseTxt('odu',r)],
    ['제품 치수 (W×H×D)', r=>dim(r,'odu_size')],
    ['제품 중량', r=>val(r,'odu_weight_kg','kg')],
    ['포장 치수 (W×H×D)', r=>dim(r,'odu_pack')],
    ['포장 중량', r=>val(r,'odu_packed_weight_kg','kg')],
    ['압축기 모델', r=>val(r,'compressor_model')],
    ['압축기 형식', r=>val(r,'compressor_type')],
    ['압축기 출력', r=>val(r,'compressor_output_kw','kW')],
    ['오일', r=>r.compressor_oil_type==null?null:`${esc(r.compressor_oil_type)} <span class="mm">${r.compressor_oil_charge_note?esc(r.compressor_oil_charge_note):fmt(r.compressor_oil_charge_cc)} cc</span>`],
    ['송풍기', r=>r.odu_fan_type==null?null:`${esc(r.odu_fan_type)} × ${fmt(r.odu_fan_qty)} <span class="mm">${esc(r.odu_fan_discharge||'')} 토출</span>`],
    ['풍량 (최대)', r=>r.odu_airflow_cmm==null?null:`${fmt(r.odu_airflow_cmm)} <span class="u">m³/min</span> <span class="mm">(${fmt(r.odu_airflow_ls)} l/s)</span>`],
    ['팬모터', r=>r.odu_fan_motor_type==null?null:`${esc(r.odu_fan_motor_type)} <span class="mm">${motor(r,'odu')||''}</span>`],
    ['열교환기', r=>r.odu_hex_type==null?null:`${esc(r.odu_hex_type)} <span class="mm">핀 ${esc(r.odu_hex_fin||'-')} / 튜브 ${esc(r.odu_hex_tube||'-')}</span>`],
    ['핀 표면처리', r=>val(r,'odu_hex_fin_coating')],
    ['케이스 재질', r=>val(r,'odu_case_material')],
  ]],
  ['temp','사용온도 범위 (실외)',[
    ['냉방', r=>trng(r,'cooling')],
    ['난방', r=>trng(r,'heating')],
  ]],
];

let current = null;
function openDetail(r, push=true){
  current = r;
  const co = r.mode==='cooling_only';
  $('#d-title').textContent = r.indoor_model;
  $('#d-star').setAttribute('aria-pressed', FAV.has(r._id));
  const secs = SECTIONS.map(([id,title,rows])=>{
    const html = rows.map(([l,f])=>{ const v=f(r); return v==null?'':`<div class="r${l?'':' cont'}"><dt>${l}</dt><dd>${v}</dd></div>`; }).join('');
    return html ? {id,title,html} : null;
  }).filter(Boolean);
  $('#d-nav').innerHTML = secs.map(s=>`<a href="#sec-${s.id}" data-jump="${s.id}">${s.title}</a>`).join('');
  $('#d-body').innerHTML = `
    <div class="hero">
      <div class="models"><span>실내기</span><b>${esc(r.indoor_model)}</b><span>실외기</span><b>${esc(r.outdoor_model)}</b></div>
      <div class="big">
        <div class="c"><small>냉방 정격</small><b>${fmtKw(r.cooling_capacity_kw_rated)}<em>kW</em></b></div>
        <div class="h"><small>난방 정격</small><b>${co?'—':fmtKw(r.heating_capacity_kw_rated)}${co?'':'<em>kW</em>'}</b></div>
      </div>
      <div class="tags">
        <span class="tag">${esc(CAT_LABEL[r.category_en])}</span><span class="tag">${esc(r.grade)}</span>
        <span class="tag ${co?'co':''}">${co?'냉방전용':'냉난방'}</span>
        <span class="tag ${r.odu_power_phase===3?'p3':''}">${r.odu_power_phase===3?'3Φ 380V':'1Φ 220V'}</span>
      </div>
      <button class="copy" id="copy-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>모델명 복사</button>
    </div>
    ${secs.map(s=>`<section class="sec" id="sec-${s.id}"><h2>${s.title}</h2><dl>${s.html}</dl></section>`).join('')}
    <p class="src">원본 PDF ${esc(r.source_pages.replace('/', ', '))}페이지</p>`;
  $('#copy-btn').onclick = ()=>{
    const t = `실내기 ${r.indoor_model} / 실외기 ${r.outdoor_model}`;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('모델명을 복사했어요'),()=>toast('복사할 수 없어요. 길게 눌러 선택해 주세요'));
  };
  const d = $('#detail'); d.scrollTop = 0; d.classList.add('on');
  if(push) history.pushState({d:r._id}, '', '#'+encodeURIComponent(r._id));
  setTimeout(()=>$('#d-back').focus({preventScroll:true}), 50);
}
function closeDetail(){ $('#detail').classList.remove('on'); current=null; }
$('#d-back').onclick = ()=>{ if(history.state && history.state.d) history.back(); else { closeDetail(); history.replaceState(null,'',location.pathname+location.search); } };
window.addEventListener('popstate', ()=>{
  const id = history.state && history.state.d;
  const r = id && DATA.find(x=>x._id===id);
  if(r) openDetail(r,false); else closeDetail();
});
$('#d-nav').addEventListener('click',e=>{
  const a = e.target.closest('[data-jump]'); if(!a) return; e.preventDefault();
  const el = document.getElementById('sec-'+a.dataset.jump);
  const head = $('.d-head').offsetHeight;
  $('#detail').scrollTo({top: el.offsetTop - head - 8, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
$('#d-star').onclick = ()=>{ if(!current) return; toggleFav(current._id); $('#d-star').setAttribute('aria-pressed', FAV.has(current._id)); };

function toggleFav(id){
  FAV.has(id) ? FAV.delete(id) : FAV.add(id); saveFav();
  toast(FAV.has(id) ? '즐겨찾기에 추가했어요' : '즐겨찾기에서 뺐어요');
  render();
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---------- events ---------- */
let qt;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ S.q=e.target.value; render(); window.scrollTo(0,0); },120); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
$('#clear').onclick = ()=>{ $('#q').value=''; S.q=''; render(); $('#q').focus(); };
$('#reset').onclick = resetAll;
$('#cats').addEventListener('click',e=>{
  if(e.target.closest('#open-f')) return openSheet();
  if(e.target.closest('[data-fav]')){ S.favOnly=!S.favOnly; render(); return; }
  const b=e.target.closest('[data-cat]'); if(!b) return;
  S.cat=b.dataset.cat; render(); window.scrollTo(0,0);
});
$('#list').addEventListener('click',e=>{
  const s=e.target.closest('[data-star]'); if(s){ e.stopPropagation(); toggleFav(s.dataset.star); return; }
  const c=e.target.closest('.card'); if(!c) return;
  const r=DATA.find(x=>x._id===c.dataset.id); if(r) openDetail(r);
});
$('#list').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#fsheet').classList.contains('on')) closeSheet(); else if(current) $('#d-back').click(); }});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
render();
(function initHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  const r = id && DATA.find(x=>x._id===id);
  if(r){ history.replaceState(null,'',location.pathname+location.search); openDetail(r); }
})();
</script>
</body>
</html>
